site_name: LangGraph Tutorial
site_description: A beginner-to-advanced guide to building agents with LangGraph, built around the runnable examples in this repository.
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - "1. Getting Started": 01-getting-started.md
  - "2. Core Concepts": 02-core-concepts.md
  - "3. Conditional Routing": 03-conditional-routing.md
  - "4. Tools & Agents": 04-tools-and-agents.md
  - "5. Memory & Persistence": 05-memory-and-persistence.md
  - "6. Multi-Agent Systems": 06-multi-agent-systems.md
  - "7. Streaming": 07-streaming.md
  - "8. Advanced Patterns": 08-advanced-patterns.md
  - "9. Deployment": 09-deployment.md
  - "10. Best Practices": 10-best-practices.md

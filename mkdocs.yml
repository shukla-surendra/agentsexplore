site_name: Agentic Development Tutorial
site_description: A beginner-to-advanced guide to agentic concepts, LangGraph, and MCP, built around the runnable examples in this repository.
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - "0. Agentic Concepts": 00-agentic-concepts.md
  - "1. Getting Started": 01-getting-started.md
  - "2. Core Concepts": 02-core-concepts.md
  - "3. Conditional Routing": 03-conditional-routing.md
  - "4. Tools & Agents": 04-tools-and-agents.md
  - "5. Memory & Persistence": 05-memory-and-persistence.md
  - "6. Multi-Agent Systems": 06-multi-agent-systems.md
  - "7. Streaming": 07-streaming.md
  - "8. Advanced Patterns": 08-advanced-patterns.md
  - "9. Deployment": 09-deployment.md
  - "10. Best Practices": 10-best-practices.md
  - "11. Model Context Protocol (MCP)": 11-mcp-agentic-capabilities.md
  - "12. Real-World Example": 12-real-world-example.md
  - RAG Knowledge Base:
      - Overview: RAG_Knowledge_Base_Starter/index.md
      - "0. Mathematics Foundations": RAG_Knowledge_Base_Starter/Mathematics_Foundations_for_Similarity_Search.md
      - "1. Embeddings": RAG_Knowledge_Base_Starter/01_Embeddings.md
      - "2. Why Embedding Models Are Needed": RAG_Knowledge_Base_Starter/02_Why_Embedding_Models_Are_Needed.md
      - "3. Similarity Search": RAG_Knowledge_Base_Starter/03_Similarity_Search.md
      - "3b. Similarity Search, In Depth": RAG_Knowledge_Base_Starter/Similarity_Search_Explanation.md
      - "4. Vector Databases": RAG_Knowledge_Base_Starter/04_Vector_Databases.md
      - "5. HNSW": RAG_Knowledge_Base_Starter/05_HNSW.md
      - "6. RAG Architecture": RAG_Knowledge_Base_Starter/06_RAG_Architecture.md
      - "7. Vector Search: Tools and Technology": RAG_Knowledge_Base_Starter/07_Vector_Search_Tools_and_Technology.md
      - "8. Interview Questions (100, with Answers)": RAG_Knowledge_Base_Starter/08_Interview_Questions.md
